<!-- whaleink RAG Chat Widget — 嵌入到博客底部 -->
<style>
#whaleink-rag-btn {
  position: fixed;
  left: 20px;
  bottom: 20px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  border: none;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(102,126,234,0.4);
  z-index: 9998;
  transition: transform 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
#whaleink-rag-btn:hover { transform: scale(1.1); }
#whaleink-rag-btn .badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: #ff4757;
  color: #fff;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 10px;
  font-weight: 600;
}

#whaleink-rag-panel {
  position: fixed;
  left: 20px;
  bottom: 80px;
  width: 360px;
  height: 520px;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  z-index: 9999;
  display: none;
  flex-direction: column;
  overflow: hidden;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

#whaleink-rag-panel.open { display: flex; }

.rag-panel-header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.rag-panel-header h3 { font-size: 15px; font-weight: 600; }
.rag-panel-header .close-btn {
  background: none;
  border: none;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  opacity: 0.7;
}
.rag-panel-header .close-btn:hover { opacity: 1; }

.rag-messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.rag-messages .rag-msg {
  max-width: 90%;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.5;
}
.rag-messages .rag-msg.user {
  align-self: flex-end;
  background: #667eea;
  color: #fff;
}
.rag-messages .rag-msg.bot {
  align-self: flex-start;
  background: #f0f0f0;
  color: #333;
}
.rag-messages .rag-msg.bot .rag-src {
  font-size: 11px;
  color: #999;
  margin-top: 4px;
}

.rag-input-area {
  display: flex;
  gap: 6px;
  padding: 10px 12px;
  border-top: 1px solid #eee;
}
.rag-input-area input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid #ddd;
  border-radius: 20px;
  font-size: 13px;
  outline: none;
}
.rag-input-area input:focus { border-color: #667eea; }
.rag-input-area button {
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 50%;
  background: #667eea;
  color: #fff;
  cursor: pointer;
  font-size: 16px;
}
.rag-input-area button:disabled { background: #ccc; }
</style>

<!-- 浮窗按钮 -->
<button id="whaleink-rag-btn" onclick="toggleRAGPanel()">
  💬
</button>

<!-- 聊天面板 -->
<div id="whaleink-rag-panel">
  <div class="rag-panel-header">
    <h3>🤖 AI 助手</h3>
    <button class="close-btn" onclick="toggleRAGPanel()">✕</button>
  </div>
  <div class="rag-messages" id="rag-messages">
    <div class="rag-msg bot">👋 你好！问一个关于博客内容的问题吧</div>
  </div>
  <div class="rag-input-area">
    <input type="text" id="rag-input" placeholder="输入问题..." onkeydown="if(event.key==='Enter')sendRAG()" />
    <button id="rag-send-btn" onclick="sendRAG()">➤</button>
  </div>
</div>

<script>
let ragLoading = false;
let ragPanelOpen = false;

function toggleRAGPanel() {
  const panel = document.getElementById('whaleink-rag-panel');
  ragPanelOpen = !ragPanelOpen;
  panel.classList.toggle('open', ragPanelOpen);
  if (ragPanelOpen) document.getElementById('rag-input').focus();
}

async function sendRAG() {
  const input = document.getElementById('rag-input');
  const btn = document.getElementById('rag-send-btn');
  const q = input.value.trim();
  if (!q || ragLoading) return;

  ragLoading = true;
  btn.disabled = true;
  input.value = '';

  const msgs = document.getElementById('rag-messages');

  // 用户消息
  const userDiv = document.createElement('div');
  userDiv.className = 'rag-msg user';
  userDiv.textContent = q;
  msgs.appendChild(userDiv);
  msgs.scrollTop = msgs.scrollHeight;

  // 打字中
  const typingDiv = document.createElement('div');
  typingDiv.className = 'rag-msg bot';
  typingDiv.textContent = '思考中...';
  typingDiv.id = 'rag-typing';
  msgs.appendChild(typingDiv);
  msgs.scrollTop = msgs.scrollHeight;

  try {
    const resp = await fetch('https://whaleink.top:8000/api/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q }),
    });

    const typing = document.getElementById('rag-typing');
    if (typing) typing.remove();

    if (!resp.ok) {
      const err = await resp.json();
      addBotMsg('😅 ' + (err.detail || '请求失败'));
      return;
    }

    const data = await resp.json();
    let text = data.answer;
    if (data.sources && data.sources.length > 0) {
      text += '\n\n📖 ' + data.sources.join(' · ');
    }
    addBotMsg(text);

  } catch (e) {
    const typing = document.getElementById('rag-typing');
    if (typing) typing.remove();
    addBotMsg('😅 网络错误，请稍后重试');
  } finally {
    ragLoading = false;
    btn.disabled = false;
    input.focus();
  }
}

function addBotMsg(text) {
  const div = document.createElement('div');
  div.className = 'rag-msg bot';
  div.textContent = text;
  document.getElementById('rag-messages').appendChild(div);
  const msgs = document.getElementById('rag-messages');
  msgs.scrollTop = msgs.scrollHeight;
}
</script>
